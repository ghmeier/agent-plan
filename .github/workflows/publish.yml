name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    # Bun ad-hoc signs darwin binaries only when it builds them on macOS, and
    # Apple silicon won't run an unsigned binary.
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing and build attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Trusted publishing needs npm 11.5.1 or later, which ships with Node 24.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - name: Check the tag matches package.json
        run: |
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Build the npm bundle and standalone binaries
        run: |
          bun run build
          mkdir -p release
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            bun build src/index.ts --compile --target="bun-$target" --outfile "release/apl-$target"
          done
          ./release/apl-darwin-arm64 --version
          cp install.sh dist/THIRD_PARTY_LICENSES release/
          cd release && shasum -a 256 apl-* install.sh > SHA256SUMS && cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/apl-*
            release/install.sh

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes release/*

      # Authenticates with OIDC through npm trusted publishing, so no npm token
      # is stored in the repo, and npm attaches provenance automatically. The
      # bundle was built and tested above, so lifecycle scripts are skipped.
      - run: npm publish --ignore-scripts
