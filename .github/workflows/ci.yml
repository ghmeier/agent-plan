name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      full-matrix:
        description: Test the Node bundle on macOS and the oldest supported Node too
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test

  # Runs the suite against the bundle npm users install. Pushes and pull
  # requests test only the newest Node on Linux, to save runner time. Releases
  # pass full-matrix to also test macOS and the oldest Node it supports.
  node:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.full-matrix && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        node: ${{ fromJSON(inputs.full-matrix && '[22, 26]' || '[26]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run test:dist
